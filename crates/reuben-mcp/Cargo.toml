[package]
name = "reuben-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio sidecar for reuben: exposes the authoring tool roster over the Model Context Protocol."

# Both a bin (the shim the MCP client spawns per conversation) and a lib, so the server logic
# and the engine-liveness seam are unit-testable in-process while the integration test spawns
# the real binary over stdio.
[lib]
name = "reuben_mcp"
path = "src/lib.rs"

[[bin]]
name = "reuben-mcp"
path = "src/main.rs"

[dependencies]
# Two things now: the engine tools' structure-channel wire types and the reports they advertise,
# and `tools::names()` — the declared roster, which covers every tool, authoring included, and which
# no phase has assigned to the window. The authoring half names core for nothing else. The
# `schemars` feature is ON here (and ONLY here) so rmcp can derive the engine tools' `outputSchema`
# from those wire types; the play/CLI build keeps schemars fenced out. Both go when the engine half
# moves behind the window and the roster finds a home.
reuben-core = { path = "../reuben-core", features = ["schemars"] }
# The window: the authoring verbs the pure tools and the document verbs are, plus the reference
# filesystem resolver (`FsResolver`) filling their resource seam. The sidecar drives no audio, so it
# takes no render half.
reuben-api = { path = "../reuben-api", default-features = false, features = [
    "authoring",
    "fs-resolver",
] }
# stdio server only: `server` + `macros` for the tool router, `transport-io` for the stdio pipe.
# No HTTP/reqwest/streamable-http transport — the network stack stays out.
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
# current_thread async runtime; the exact feature set measured as sufficient.
tokio = { workspace = true, features = ["sync", "rt", "time", "io-std"] }
serde = { workspace = true }
serde_json = { workspace = true }
# JSON Schema derive for the tool input/output types — the same schemars the contract types use.
schemars = { workspace = true }
