[package]
name = "reuben-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio sidecar for reuben: exposes the authoring tool roster over the Model Context Protocol."

# Both a bin (the shim the MCP client spawns per conversation) and a lib, so the server logic
# and the engine-liveness seam are unit-testable in-process while the integration test spawns
# the real binary over stdio.
[lib]
name = "reuben_mcp"
path = "src/lib.rs"

[[bin]]
name = "reuben-mcp"
path = "src/main.rs"

[dependencies]
# The window, and nothing behind it. Every tool this door advertises — the pure reads, the document
# verbs, the engine verbs and the roster they are declared in — comes through here, plus the
# reference filesystem resolver (`FsResolver`) filling the resource seam. The sidecar drives no
# audio, so it takes no render half.
reuben-api = { path = "../reuben-api", default-features = false, features = [
    "authoring",
    "fs-resolver",
] }
# stdio server only: `server` + `macros` for the tool router, `transport-io` for the stdio pipe.
# No HTTP/reqwest/streamable-http transport — the network stack stays out.
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
# current_thread async runtime; the exact feature set measured as sufficient.
tokio = { workspace = true, features = ["sync", "rt", "time", "io-std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
# JSON Schema derive for the tool input/output types — the same schemars the window derives its own
# argument and result shapes with. Nothing behind the window derives one.
schemars = { workspace = true }
