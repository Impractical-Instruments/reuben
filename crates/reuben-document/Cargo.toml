[package]
name = "reuben-document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authoring instrument documents and turning them into an engine Plan: the format, the edit verbs, the projections, and the Coordinator."

[features]
# Derives `schemars::JsonSchema` on the instrument-format types (src/format) and on nothing else, so
# the projection's completeness guard can enumerate every format field mechanically. Default-off and
# enabled by NO crate: CI names it on the test step, which is the only thing keeping that guard
# running. Moved here with `format` — reuben-core no longer has a format to derive on.
schemars = ["dep:schemars"]
# Forwards to `reuben-core/bench`, which exposes the per-operator micro-bench `Io` bridge. The
# micro `[[bench]]` targets below declare `required-features = ["bench"]`, so a bare `cargo bench`
# skips them (no error) while `cargo reuben-bench` runs every layer.
bench = ["reuben-core/bench"]

[dependencies]
# The render half this crate builds against. Every import crosses upward: this crate names
# reuben-core, and reuben-core names nothing here.
reuben-core = { path = "../reuben-core" }
# The type-wide NUMBER_MIN/NUMBER_MAX sentinels the authoring surface bounds against.
reuben-contract = { path = "../reuben-contract" }
slotmap.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true
hound.workspace = true
# Perf infra. criterion: local wall-clock. iai-callgrind: CI regression gate. The benches live here
# rather than beside the render code because every realistic workload is an instrument *document*,
# and the loader that turns one into a Plan is this crate's.
criterion = "0.8"
iai-callgrind = "0.16"

# The OpDriver fidelity pin reaches `reuben_core::op_driver`, which is gated behind the bridge
# feature. `required-features` so a bare `cargo test` skips it (no error) rather than failing to
# compile — the same contract the micro benches below use.
[[test]]
name = "op_driver_fidelity"
required-features = ["bench"]

# Macro render_block benches. `harness = false` — both bring their own main().
[[bench]]
name = "macro_criterion"
harness = false

[[bench]]
name = "macro_iai"
harness = false

# Construct (parse + build + instantiate) benches. Same two layers as the macro set, but swept
# across node counts: what they measure is how build cost scales, not its absolute value.
[[bench]]
name = "construct_criterion"
harness = false

[[bench]]
name = "construct_iai"
harness = false

# Per-operator micro benches. `required-features = ["bench"]` ⇒ cargo SKIPS these (no error)
# unless the bridge feature is on, so a bare `cargo bench` runs the macro and construct layers but
# not this one; the full run (`cargo reuben-bench`) covers all three. Same two layers as the
# macro set.
[[bench]]
name = "micro_criterion"
harness = false
required-features = ["bench"]

[[bench]]
name = "micro_iai"
harness = false
required-features = ["bench"]
