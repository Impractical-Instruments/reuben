[package]
name = "reuben-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable, OS-free realtime core for reuben: graph, plan, render."

[features]
# Exposes `bench_support` (the per-operator micro-bench `Io` bridge). Non-default
# so the bridge never ships in a normal build/publish. The `[[bench]]` targets that consume it now
# live in `reuben-document` (they load instrument documents), so it is reached as
# `reuben-core/bench` — via reuben-document's own `bench` feature, which forwards to this one.
# CI runs the micro layer + its forcing-function test with it (locally: `cargo reuben-bench`,
# see .cargo/config.toml).
bench = []
# Derives `schemars::JsonSchema` on the instrument-format types (src/format) and on nothing else, so
# the projection's completeness guard can enumerate every format field mechanically. Every advertised
# schema derives from reuben-api's own types, so the report, view and projection shapes here need no
# derive at all and no longer carry one. Default-off and enabled by NO crate: CI names it on the test
# step, which is the only thing keeping that guard running.
schemars = ["dep:schemars"]

[dependencies]
slotmap.workspace = true
smallvec.workspace = true
num-traits.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
inventory.workspace = true
# The operator_contract! macro: single-sources each operator's index consts + Descriptor.
reuben-macros = { path = "../reuben-macros" }
# The type-wide NUMBER_MIN/NUMBER_MAX sentinels: interface pipes default
# their declared range to the same one definition the contract macro uses.
reuben-contract = { path = "../reuben-contract" }

[dev-dependencies]
approx.workspace = true
# The `first_sound` example writes a WAV. It builds its graph in Rust rather than loading a
# document, which is what keeps it here: it is the render half demonstrated without the authoring
# half, and the shape a bare-metal embedder copies.
hound.workspace = true

[[example]]
name = "first_sound"
