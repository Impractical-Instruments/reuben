[package]
name = "reuben-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable, OS-free realtime core for reuben: graph, plan, render."

[features]
# Exposes `bench_support` (the per-operator micro-bench `Io` bridge). Non-default
# so the bridge never ships in a normal build/publish. The `[[bench]]` targets that consume it now
# live in `reuben-document` (they load instrument documents), so it is reached as
# `reuben-core/bench` — via reuben-document's own `bench` feature, which forwards to this one.
# CI runs the micro layer + its forcing-function test with it (locally: `cargo reuben-bench`,
# see .cargo/config.toml).
bench = []

[dependencies]
slotmap.workspace = true
smallvec.workspace = true
once_cell.workspace = true
# The operator_contract! macro: single-sources each operator's index consts + Descriptor.
reuben-macros = { path = "../reuben-macros" }
# The type-wide NUMBER_MIN/NUMBER_MAX sentinels: interface pipes default
# their declared range to the same one definition the contract macro uses.
reuben-contract = { path = "../reuben-contract" }

# num-traits' `Float` backend, selected by TARGET rather than by a feature on this crate, because
# the two targets want different implementations and neither one is right for both.
#
# `libm` is a software implementation. Where no `std` exists it is the only implementation there is.
# On the host it would be a regression twice over, both measured: its `sinf`/`cosf`/`tanf`/`expf`/
# `powf`/`tanhf` differ from the platform's by up to 2 ULP on ~1–14% of inputs, which moves the
# bit-exact operator assertions; and `floor`/`ceil`/`round`/`trunc` become out-of-line calls into
# software instead of the single rounding instruction the x86-64 baseline in `.cargo/config.toml`
# exists to buy — which that file measures at ~17% of the oscillator's instructions and ~35% of the
# LFO's.
#
# This is NOT a `std` feature on this crate, and it reintroduces none of what one would cost. The
# crate is `no_std` in every SHIPPED build shape — the one exception is the lib *test* target, which
# `cfg_attr(not(test), …)` exempts and which nothing ships — so nothing can be forgotten and nothing
# is additive; both num-traits backends present the same `Float` API, so the ordinary host build
# still proves every call site compiles with no `std` to reach.
#
# A single `libm` entry for both was measured and rejected. `criterion` — a DEV-dependency of
# reuben-document — declares num-traits with `features = ["std"]` unconditionally, and `plotters`
# beneath it enables `num-traits/default`, which is the same thing. So the split is NOT workspace
# against single package: with a global `libm` entry, `cargo tree --workspace -e normal` stays on
# libm. It is `cargo build`, which resolves libm, against any invocation that pulls
# dev-dependencies — `cargo test`, `cargo bench` — which resolves std. That is the worst available
# division, because it ships an rlib carrying math the test suite never ran. Same source, same host,
# two different sounds, decided by which invocation reached it — which the determinism invariant
# cannot carry.
#
# The enabler is named precisely because getting it wrong is how these two entries get collapsed
# back into one. `criterion` is a BENCH dependency, so no amount of pruning the authoring-side tree
# — dropping reuben-mcp, rmcp, schemars, chrono — retires the hazard. Re-measure before collapsing:
# `cargo tree --workspace -e all -f "{p} {f}" | grep num-traits`.
[target.'cfg(target_os = "none")'.dependencies]
num-traits = { workspace = true, features = ["libm"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
num-traits = { workspace = true, features = ["std"] }

[dev-dependencies]
approx.workspace = true
# The `first_sound` example writes a WAV. It builds its graph in Rust rather than loading a
# document, which is what keeps it here: it is the render half demonstrated without the authoring
# half, and the shape a bare-metal embedder copies.
hound.workspace = true

[[example]]
name = "first_sound"
