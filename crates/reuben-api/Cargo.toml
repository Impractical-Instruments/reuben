[package]
name = "reuben-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The one window between reuben-core and every consumer: the authoring surface, the render surface, and the host-implemented resource seam."

[features]
default = ["authoring", "render"]
# The authoring/control half: document verbs, introspection, and the result shapes a door
# advertises. Serde-shaped and schema-derived, because everything here is serialized to a
# consumer; nothing here is on the audio callback's path, so the cost is irrelevant.
authoring = ["dep:serde", "dep:schemars"]
# The render half: what a host drives per block. Carries no serialization — a conversion
# here would be paid once per block, which is the whole cost.
render = []
# The shareable reference filesystem resolver. Off by default: the resolver is the one call
# *in*, the host implements it, and shipping ours unprivileged is what keeps that true. A host
# whose sources are not files (the browser) writes its own instead.
fs-resolver = ["dep:hound"]

[dependencies]
reuben-core = { path = "../reuben-core" }
serde = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
# WAV decode for the reference filesystem resolver, and only for it.
hound = { workspace = true, optional = true }
