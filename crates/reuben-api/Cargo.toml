[package]
name = "reuben-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The one window between reuben-core and every consumer: the authoring surface, the render surface, and the host-implemented resource seam."

[features]
default = ["authoring", "render"]
# The authoring/control half: document verbs, introspection, the engine verbs and both ends of the
# structure channel, the roster they are advertised through, and the result shapes a door serves.
# Serde-shaped and schema-derived, because everything here is serialized to a consumer; nothing
# here is on the audio callback's path, so the cost is irrelevant.
# `reuben-document` is an authoring dependency and only an authoring one: the render half must
# stay buildable for a target that has no serde, no filesystem and no `std`, which is the whole
# point of the crate split below it.
authoring = ["dep:reuben-document", "dep:serde", "dep:serde_json", "dep:schemars"]
# The render half: what a host drives per block, plus `install_graph` for a host that builds its
# graph in Rust. Carries no serialization — a conversion here would be paid once per block, which
# is the whole cost. CI cross-builds exactly this feature set, which is what keeps it free of `std`.
render = []
# The shareable reference filesystem resolver, for a host whose sources are files. Off by
# default — the resource seam is host-implemented; this is one implementation, not the seam.
# Implies `authoring`: it implements the resolver trait the loader calls, and there is nothing
# for it to resolve *for* without the loader.
fs-resolver = ["authoring", "dep:hound"]

[dependencies]
reuben-core = { path = "../reuben-core" }
# The authoring half. Optional and gated by the `authoring` feature — never reachable from a
# render-only build.
reuben-document = { path = "../reuben-document", optional = true }
serde = { workspace = true, optional = true, features = ["std"] }
# The free-form leaves of the authoring surface — a node input's literal, a constant's value —
# where the document format's own union is what the model sends and the engine type-checks.
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
# WAV decode for the reference filesystem resolver, and only for it.
hound = { workspace = true, optional = true }
