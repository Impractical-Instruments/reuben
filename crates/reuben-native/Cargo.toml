[package]
name = "reuben-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Removable native layer for reuben: live audio (cpal) + OSC-in (UDP)."

[dependencies]
# The window, and the only way this crate reaches the engine: the engine verbs the engine channel
# serves, the client half of that channel the `describe`/`validate`/`new-instrument` subcommands
# dial (`tcp`), the render pair `play` drives per block, and the reference filesystem resolver
# (`FsResolver`, which brings `hound` with it) filling the server's resource seam. Both halves, so
# the default feature set plus the resolver and the client transport.
reuben-api = { path = "../reuben-api", features = ["fs-resolver", "tcp"] }
# Shared operator-contract spec types + validation, single-sourced with the macro.
reuben-contract = { path = "../reuben-contract" }
cpal.workspace = true
midir.workspace = true
rosc.workspace = true
# Input-callback -> render-thread SPSC ring.
rtrb.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
clap.workspace = true
# Follows outside edits to the open instrument's files.
notify.workspace = true

# SIGINT/SIGTERM handler for `play`'s clean shutdown. Unix-only: `play`'s dev
# persona is a checkout + a terminal; non-unix keeps the OS default Ctrl-C.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
approx.workspace = true
# The client transport, to dial the engine-channel server the tests bind.
reuben-api = { path = "../reuben-api", features = ["fs-resolver", "tcp"] }
# The pattern compiler, to check that every line of the example sets compiles for its input.
reuben-pattern = { path = "../reuben-pattern" }

[[bin]]
name = "reuben"
path = "src/bin/reuben.rs"
