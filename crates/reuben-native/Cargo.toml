[package]
name = "reuben-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Removable native layer for reuben: live audio (cpal) + OSC-in (UDP)."

[dependencies]
# The window, and the only way this crate reaches the engine: the authoring verbs the
# `describe`/`validate`/`new-instrument` subcommands are, the engine verbs the structure channel
# serves, the render pair `play` drives per block, and the reference filesystem resolver
# (`FsResolver`, which brings `hound` with it) filling their resource seam. Both halves, so the
# default feature set plus the resolver.
reuben-api = { path = "../reuben-api", features = ["fs-resolver"] }
# Shared operator-contract spec types + validation, single-sourced with the macro.
reuben-contract = { path = "../reuben-contract" }
cpal.workspace = true
rosc.workspace = true
# Input-callback -> render-thread SPSC ring (P5/#182).
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true

# SIGINT/SIGTERM handler for `play`'s clean shutdown. Unix-only: `play`'s dev
# persona is a checkout + a terminal; non-unix keeps the OS default Ctrl-C.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
approx.workspace = true

[[bin]]
name = "reuben"
path = "src/bin/reuben.rs"
