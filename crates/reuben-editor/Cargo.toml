[package]
name = "reuben-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop instrument editor for reuben."
publish = false

[dependencies]
eframe.workspace = true
clap.workspace = true
# As a library: the engine entry point `reuben play` is a caller of, and the flags it starts from.
reuben-native = { path = "../reuben-native" }
# The controls panel reads an instrument's interface and sends live control values through the
# window. `tcp` is the transport an editor attached to a running `reuben play` dials it with.
reuben-api = { path = "../reuben-api", features = ["fs-resolver", "tcp"] }
# The per-user state under the config directory (the stored audio device choice) and the
# surface-doc reader are both JSON.
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
notify.workspace = true
rfd.workspace = true

[dev-dependencies]
# The tests reach the embedded engine the way the sidecar does: reuben-mcp's own link over the
# loopback socket.
reuben-mcp = { path = "../reuben-mcp" }
egui_kittest.workspace = true

[[bin]]
name = "reuben-editor"
path = "src/main.rs"
