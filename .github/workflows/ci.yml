name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    # `ready_for_review` so converting a draft to ready triggers a run.
    types: [opened, synchronize, reopened, ready_for_review]

# Path filtering is per-JOB, not workflow-level (see the `changes` job): each gate runs only when a
# file that can move ITS outcome changed — code under test, test/bench DATA (instruments/), or the
# infra that builds/runs it. The old workflow-level `paths-ignore` was removed so a partial or mixed
# change routes to exactly the affected jobs instead of the all-or-nothing blanket skip. A change
# that touches no gated path (docs-only, LICENSE, …) leaves every filtered job Skipped; the
# `ci-passed` aggregate job below still reports green (it counts a Skipped upstream as a pass), so the
# PR stays mergeable. The `dev` ruleset requires `ci-passed` — never the filtered jobs directly,
# because a Skipped filtered job reads to a ruleset as an unmet "expected but missing" required check.

# Cancel superseded runs on the same ref so the latest push wins and minutes aren't wasted —
# EXCEPT pushes to main and dev. Every commit on those two branches must get its own run so the perf
# gate records a history point for each (layer 1) — main to the `bench-history` branch, dev
# to `bench-history-dev`; cancelling an in-progress or queued run punches a hole in the trend on rapid
# pushes/merges. So main and dev pushes get a SHA-unique group (nothing to cancel against) with
# cancellation off; PR and other branch runs keep per-ref grouping and still cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  # Diff the change against the PR base (pull_request) or the before-SHA (push) and expose one
  # boolean per downstream job, so each gate below runs only when a path it cares about changed.
  # Seconds-long and always runs (even on drafts) — the expensive jobs it feeds carry the draft skip.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      lockstep: ${{ steps.filter.outputs.lockstep }}
      check: ${{ steps.filter.outputs.check }}
      windows: ${{ steps.filter.outputs.windows }}
      bare_metal: ${{ steps.filter.outputs.bare_metal }}
      bench: ${{ steps.filter.outputs.bench }}
      eval: ${{ steps.filter.outputs.eval }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Anchor: any change that can move the Rust workspace build/test/perf outcome. Shared by
            # the three `--workspace` jobs (check, windows, bench) — every crate transitively depends
            # on reuben-contract, so a `--workspace` gate has no sound per-crate split. instruments/ is
            # test + bench DATA (include_str!/include_bytes! + fs-resolved fixtures), so it lives here;
            # .cargo/config.toml sets the build's target-cpu (and perf-gate snapshots it); the workflow
            # + the shared toolchain composite are the infra that runs every job.
            _workspace: &workspace
              - 'crates/reuben-contract/**'
              - 'crates/reuben-macros/**'
              - 'crates/reuben-core/**'
              - 'crates/reuben-api/**'
              - 'crates/reuben-native/**'
              - 'crates/reuben-mcp/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - 'instruments/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
            # Pure text check: the pin, the MSRV declaration it must equal, and its own
            # script. Nothing else can red it. (It used to also gate on the detached reuben-web
            # crate's own rust-version; that crate left with the extraction.)
            lockstep:
              - 'rust-toolchain.toml'
              - 'Cargo.toml'
              - '.github/scripts/check-msrv-lockstep.sh'
              - '.github/workflows/ci.yml'
            # fmt + clippy + workspace test, PLUS the skill Python suites (control-surface today), so
            # a skill-only change still re-runs its tests. (The control-surface suite reads committed
            # instruments/ — covered by *workspace — but no committed surfaces/, so no surfaces/ trigger.)
            check:
              - *workspace
              - '.claude/skills/**'
            windows:
              - *workspace
            # The bare-metal cross build, and deliberately NARROWER than *workspace rather than
            # riding it. Two packages are cross-built — reuben-core, and reuben-api's render half —
            # so what can move this outcome is those two plus the two crates below them.
            # reuben-document is NOT here even though reuben-api names it: it is an optional
            # dependency of the `authoring` feature, which the render-only build does not enable,
            # so no cross build resolves it. reuben-native and reuben-mcp sit above the window and
            # reach the bare-metal target by no path at all, and instruments/ is test DATA no cross
            # build reads. .cargo/config.toml is here because it sets rustflags (scoped to x86_64
            # today, which is exactly the kind of scoping a later edit can widen by accident).
            bare_metal:
              - 'crates/reuben-core/**'
              - 'crates/reuben-api/**'
              - 'crates/reuben-macros/**'
              - 'crates/reuben-contract/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rust/**'
            # The perf gate benches the same workspace closure; add its own gate script. .cargo/
            # config.toml is already in the anchor (perf-gate.sh snapshots it into the baseline build).
            bench:
              - *workspace
              - '.github/scripts/perf-gate.sh'
            # The agent-surface eval gate. Its trigger set is DIFFERENT from *workspace, and
            # deliberately wider in one direction: `docs/agents/**` is served to models as MCP
            # resources (the authoring guide, the intent vocabulary), so a docs-only edit there is a
            # real grounding-token change that no Rust gate can see. `.claude/skills/**` is NOT here
            # — skills are host-side prompting, not bytes the sidecar hands back.
            eval:
              - *workspace
              - 'docs/agents/**'
              - 'eval/**'
              - '.github/scripts/eval-gate.sh'
            # The dashboard renders both trends and is the half a human actually reads. Its own
            # filter rather than riding `eval`'s: that job builds `reuben-mcp` twice and swaps the
            # measured surface to a baseline commit, and a one-line edit to a charting script has no
            # business paying for that. Same guarantee, a fraction of the minutes.
            dashboard:
              - '.github/scripts/bench-dashboard.py'
              - '.github/scripts/test_bench_dashboard.py'
              - '.github/workflows/ci.yml'

  lockstep:
    name: MSRV lockstep (toolchain == rust-version)
    runs-on: ubuntu-latest
    needs: changes
    # Same draft-skip as the other jobs, now AND'd with its path gate. Pure text check — no toolchain,
    # seconds to run.
    if: needs.changes.outputs.lockstep == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert rust-toolchain.toml channel == Cargo.toml rust-version
        run: ./.github/scripts/check-msrv-lockstep.sh

  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    needs: changes
    # Skip draft PRs; always run on push to main (which has no pull_request payload). Gated on a
    # workspace-code or skill change.
    if: needs.changes.outputs.check == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0 # faster, smaller cache on CI's cold builds
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ALSA dev headers (cpal, for reuben-native)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      # Single source of truth = rust-toolchain.toml; the composite
      # installs + caches the pinned channel. No version hardcoded here.
      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      # `--features reuben-document/bench` so clippy lints the per-operator micro-bench code: its
      # `[[bench]]` targets declare `required-features = ["bench"]`, so without the flag
      # `--all-targets` silently skips them.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features reuben-document/bench -- -D warnings

      # Same flag so the forcing-function tests run (they live in the feature-gated
      # `bench_support` module): they red CI if a new operator lacks a micro-bench workload, or if
      # the iai gate list drifts from it. `reuben-document/schemars` is named here because this step is
      # now the only thing that enables it: no crate depends on the feature any more, and the
      # projection's completeness guard lives behind it — a new instrument-format field with
      # no projection view must red the build, and nothing else would make that happen.
      - name: Test
        run: cargo test --workspace --features reuben-document/bench,reuben-document/schemars

      # The render-only build of the window, which no in-tree consumer compiles: the hosts that
      # take it — the browser worklet, a bare-metal embedder — live in other repositories behind a
      # submodule pin. Without this step the authoring/render fence would be an intention that
      # first fails for someone else, on a bump, days later.
      #
      # `test`, not `check`: the render module's own tests walk the whole document-free path
      # (`Graph` -> `install_graph` -> `RenderSlot` -> `fill`), and under the default features they
      # would prove only that the path works for a host that also compiled the authoring half.
      # Running them with exactly the embedder's feature set is what makes them a fence.
      #
      # It is also the only step here that can see a stray `use std::…` in the render half: the
      # crate is `#![no_std]`, but its `authoring` feature declares `extern crate std`, so under the
      # default features `std` resolves from anywhere in it — including code that must never reach
      # it. The `bare-metal` job below cross-builds this same feature set and is the stronger check,
      # but it is not in `ci-passed`'s `needs`, so this host run is the one that gates a merge.
      - name: Render-only feature fence (reuben-api)
        run: cargo test -p reuben-api --no-default-features --features render

      # Skill scripts that inline an engine contract ship their own Python tests (control-surface's
      # `gen_surface.py` today); its live-engine boundary test runs `reuben describe` via `cargo
      # run` to catch format drift instead of letting the skill rot silently. That `cargo
      # run` uses the same `--features reuben-document/bench` as the clippy/test steps above, so it
      # reuses their compiled artifacts rather than triggering a featureless rebuild. Generic over
      # the skills dir so a future skill's `test_*.py` is picked up without editing CI; each suite
      # runs from its own dir because the tests import their script by bare module name.
      - name: Skill tests (Python)
        run: |
          for d in .claude/skills/*/; do
            if ls "$d"test_*.py >/dev/null 2>&1; then
              echo "== $d ==" && (cd "$d" && python3 -m unittest)
            fi
          done

  windows:
    name: build + test (windows)
    runs-on: windows-latest
    needs: changes
    # Same draft-skip as `check`, AND'd with the workspace path gate. Proves the build + non-audio
    # logic on Windows: a headless runner can't init WASAPI, so audio out is verified by
    # a manual smoke pass on real hardware — not here. fmt/clippy/lockstep are
    # platform-independent and stay ubuntu-only (`check`); no need to re-run them.
    # No ALSA install: cpal links WASAPI on Windows, and tests open no device.
    if: needs.changes.outputs.windows == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -D warnings # catch platform-gated warnings the Linux build can't see
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned toolchain as `check`, via the shared composite.
      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --workspace

      # Same features as `check`: compiles `bench_support` + runs the forcing-function tests
      # and the projection completeness guard on Windows too.
      - name: Test
        run: cargo test --workspace --features reuben-document/bench,reuben-document/schemars

  # The render path cross-built for thumbv7em-none-eabihf (Cortex-M7, no OS): `reuben-core`, and
  # the render-only build of `reuben-api` — the window an embedder actually calls, which until it
  # took the `no_std` attribute was the one crate standing between a Rust-built graph and bare
  # metal. rustup ships no `std` for any `*-none-*` triple, so this is the one job here where `std`
  # does not exist — which is what makes it a gate rather than a smoke test. A `use std::…` in a new
  # operator, or in the render half of the window, is a compile error here and invisible to every
  # other job, so without it the portable path is an event in these crates' history rather than a
  # property of them.
  #
  # TWO THINGS IT CANNOT DO, because the name implies otherwise. It cannot run TESTS — there is no
  # host on the target and QEMU or an on-device harness is out of scope — so it proves the crates
  # COMPILE, and behaviour stays proven by `check`/`windows`. And it cannot prove the code is
  # CORRECT there: Cortex-M7 is a different float environment, and the software libm this target
  # resolves need not agree with the host's `std` to the last bit. Only this job touches libm at all.
  #
  # GREEN NOW — the port landed, and a red run here is a REAL FAILURE rather than the documented
  # expected-red state an earlier era of this comment described. WHAT the port consists of lives in
  # exactly one place, CONTRIBUTING.md's "The bare-metal target" section, and is deliberately NOT
  # restated here: an earlier version of this paragraph did restate it and drifted, naming
  # dependencies that had already left the graph while the port moved underneath it. Do not restate
  # it again — this paragraph now carries only the fact that the job passes.
  #
  # WHY the gate landed before the port it gates is this paragraph's own to keep: written after the
  # port, it would have gated nothing that happened during it.
  # STILL ABSENT FROM `ci-passed`'s `needs`, so it blocks no merge. That is now the only thing
  # standing between this job and being enforced, and wiring it in is its own tracked change — not
  # an oversight of the port. Until it happens, a red run here is easy to miss and no check notices.
  #
  # One job, one target: a second embedded triple is cost without a second consumer.
  bare-metal:
    name: bare-metal build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bare_metal == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # No job-level `RUSTFLAGS: -D warnings`, unlike `check` and `windows`: RUSTFLAGS reaches
      # DEPENDENCY crates, and a warning in someone else's crate on a target its author never
      # publishes for is not a defect any change here can address. `-D warnings` goes after clippy's
      # `--` instead, where it binds to this workspace only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `rustup target add`: rust-toolchain.toml carries the target, so the pin provisions it here
      # and in a contributor's clone alike.
      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Before the build, so it is on the summary page even when the compile dies in the first
      # seconds. It names WHAT is cross-built, which is the one thing here a change can move; the
      # two limits below it stay true whatever that list becomes.
      - name: What this gate proves
        run: |
          {
            echo "### bare-metal build (thumbv7em-none-eabihf)"
            echo
            echo "Proves \`reuben-core\` and \`reuben-api\`'s render half **compile** with no \`std\` available."
            echo
            echo "- It cannot run tests: there is no host on the target."
            echo "- It cannot prove correctness there: Cortex-M7 is a different float environment."
          } >>"$GITHUB_STEP_SUMMARY"

      # `--release` because that is what an embedder ships. Two packages and no more: the render
      # half itself, and the window's render-only door onto it — which is the shape an embedder
      # compiles, so it is the shape that has to keep building. Nothing above the window claims to
      # reach this target.
      - name: Cross-build reuben-core
        run: cargo build -p reuben-core --target thumbv7em-none-eabihf --release

      # `--no-default-features --features render` is the whole point: the default features pull in
      # `authoring`, and `reuben-document` with it, which no `*-none-*` triple can build.
      - name: Cross-build reuben-api (render half)
        run: cargo build -p reuben-api --no-default-features --features render --target thumbv7em-none-eabihf --release

      # A REPORTED NUMBER, NEVER A THRESHOLD — nothing here fails on size. The embedder's 128 KB of
      # internal flash is a constraint the image is expected to exceed and to live in external QSPI
      # behind a bootloader: the embedder's problem, not this repo's.
      #
      # KNOW WHAT THE NUMBER IS, because it is NOT "the size of reuben-core". It is the machine code
      # rustc chose to EMIT into the rlib, and every limit below was measured on a probe crate at this
      # pin rather than assumed. Generic instantiation dominates it: one `sort_unstable()` call put
      # `core::slice::sort::quicksort` at 2990 of the probe's 3952 bytes. Below rustc's
      # cross-crate-inlining threshold nothing is emitted at all, and that threshold reads the
      # POST-OPTIMIZATION MIR body rather than how much code was written — a 12-byte function can be
      # emitted while a 726-byte one is not. So it does not detect "this change doubled the code
      # size", and must not be read that way.
      #
      # WHAT IT DOES DETECT is a new heavyweight generic A MEASURED CRATE ITSELF MONOMORPHIZES, in a
      # non-`#[inline]` function above that threshold. Miss any part of that and it is blind: a crate
      # exposing only `pub fn sort_any<T: Ord>` measures byte-identical to an empty one while the
      # embedder that instantiates it pays 3824 bytes, and `#[inline]` on a function worth 3862 takes
      # it to 0. Sensitivity spans 77x across what it does catch (+3862 for `sort_unstable`, +50 for
      # `format!`). So a jump is worth reading and silence proves nothing.
      # `--crate-type staticlib` was measured as the alternative and is worse: it emits only what is
      # reachable from `#[no_mangle]` exports, so BOTH probe deltas were 0 against a 323 KB
      # `core` + `compiler_builtins` floor — and it cannot build at all for a library that leaves the
      # panic handler and global allocator to its embedder, which is exactly this crate.
      #
      # Runs before clippy so the number survives a run clippy reds.
      - name: Report .text size
        run: |
          set -o pipefail
          shopt -s nullglob
          # Globbed rather than hardcoded: cargo uplifts exactly the requested package's lib into
          # this directory, and a `[lib] name = …` would silently move a fixed path. Each
          # cross-build above uplifts one and neither displaces the other, so this reports a line
          # PER rlib rather than asserting how many there are — an assertion of "exactly 1" is what
          # a second cross-build would turn into a silent skip of the whole measurement. Every
          # failure below reports NOTHING and reds nothing — never "0 bytes", which would read as a
          # measurement. `run:` steps get `bash -e` without pipefail, hence the first line.
          rlibs=(target/thumbv7em-none-eabihf/release/*.rlib)
          if [ "${#rlibs[@]}" -eq 0 ]; then
            echo "::warning::no uplifted rlib found — .text size not reported"
            exit 0
          fi
          if ! command -v size >/dev/null; then
            echo "::warning::binutils \`size\` not on PATH — .text size not reported"
            exit 0
          fi
          for rlib in "${rlibs[@]}"; do
            if ! text=$(size -A "$rlib" | awk '$1 ~ /^\.text/ { t += $2 } END { printf "%d", t+0 }'); then
              echo "::warning::\`size\` could not read $rlib — .text size not reported"
              continue
            fi
            echo ".text = $text bytes ($rlib)"
            if [ "$text" -eq 0 ]; then
              echo "::warning::.text is 0 for ${rlib##*/} — rustc emitted no machine code for this target. A finding, not a size."
            fi
            echo "\`.text\` emitted into \`${rlib##*/}\` (release): **$text bytes**" >>"$GITHUB_STEP_SUMMARY"
          done

      # Clippy on the CROSS target: it type-checks against `core`/`alloc` instead of `std`, so it
      # reaches a class of thing `check`'s host run cannot see. No `--all-targets` on either: the
      # non-lib targets under these two packages are the two lib test targets and `reuben-core`'s
      # `first_sound` example, all host-side by construction and each free to link `std`. (Neither
      # package has benches — the `[[bench]]` targets are `reuben-document`'s, which is not
      # cross-built at all.)
      - name: Clippy (cross target)
        run: cargo clippy -p reuben-core --target thumbv7em-none-eabihf --release -- -D warnings

      - name: Clippy reuben-api render half (cross target)
        run: cargo clippy -p reuben-api --no-default-features --features render --target thumbv7em-none-eabihf --release -- -D warnings

      # Three readings, because they need different responses and only a reader can tell them apart.
      # The readings themselves have outlived the port; the reproduce lines under them have not, and
      # every command this job runs has to appear there or a reader is sent to reproduce half of it.
      - name: How to read a red run
        if: failure()
        run: |
          {
            echo
            echo "**This gate failed. Which of three it is depends on where the error is:**"
            echo
            echo "1. Before the build — checkout or toolchain provisioning. Infrastructure, not the"
            echo "   crates; neither reading below applies."
            echo "2. Inside a third-party dependency reached only on this target — someone else's"
            echo "   crate, on a triple its author never publishes for. This job is not in"
            echo "   \`ci-passed\`'s \`needs\`, so it blocks no merge while that is sorted out."
            echo "3. On a line this change touched — \`std\` crept back into the portable core, or into"
            echo "   the render half of the window. That is the defect this gate exists to catch, and"
            echo "   it is fixed here, not merged past."
            echo
            echo "Reproduce locally — all four, in this order, because the clippy pair carries"
            echo "\`-D warnings\` and reds this job on its own:"
            echo
            echo "    cargo build  -p reuben-core --target thumbv7em-none-eabihf --release"
            echo "    cargo clippy -p reuben-core --target thumbv7em-none-eabihf --release -- -D warnings"
            echo "    cargo build  -p reuben-api --no-default-features --features render --target thumbv7em-none-eabihf --release"
            echo "    cargo clippy -p reuben-api --no-default-features --features render --target thumbv7em-none-eabihf --release -- -D warnings"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  bench:
    name: perf gate (macro + micro + construct Ir)
    runs-on: ubuntu-latest
    needs: changes
    # Same draft-skip as `check`, then the path gate OR an unconditional run on every push to main/dev.
    # The path gate alone punched holes in the bench trend: a push to main/dev that moved no benched
    # path (docs-only, …) skipped this job, so `bench-history` below found no artifact and
    # recorded no point. Recording a history point for EVERY main/dev push is the intent the
    # concurrency block already encodes (SHA-unique group, cancellation off); this clause makes the
    # per-job gate honor it. PRs and other-branch pushes stay purely path-gated. Runs in parallel —
    # nobody waits on valgrind for fmt/test.
    if: >-
      (github.event_name == 'push' || github.event.pull_request.draft == false)
      && (needs.changes.outputs.bench == 'true'
          || (github.event_name == 'push'
              && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')))
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the baseline commit (PR base / previous push) in history

      # Unconditional, including on a cache hit: valgrind Depends on libc6-dbg, which the cache
      # below deliberately does not hold (it must match the runner image's libc6 exactly), so apt
      # fetches it from the network at install time. Against a stale index that fetch names a glibc
      # point release that has already left the pool, and 404s.
      - name: Refresh apt index
        run: sudo apt-get update

      # Cache the valgrind .deb so the download is skipped on a hit, mirroring the
      # iai-callgrind-runner cache below.
      - name: Cache valgrind .deb
        id: vg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/valgrind-debs
          # Bump the trailing version to force a refresh of the cached package.
          key: valgrind-deb-1-${{ runner.os }}
      - name: Download valgrind .deb (cache miss)
        if: steps.vg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/valgrind-debs
          cd ~/valgrind-debs && apt-get download valgrind
      - name: Install valgrind (callgrind backend for iai-callgrind)
        run: sudo apt-get install -y --no-install-recommends ~/valgrind-debs/*.deb

      # Same pinned toolchain as `check`, via the shared composite.
      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The runner binary must match the iai-callgrind dev-dependency (0.16.x).
      - name: Cache iai-callgrind-runner
        id: iai-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/iai-callgrind-runner
          key: iai-callgrind-runner-0.16.1-${{ runner.os }}
      - name: Install iai-callgrind-runner
        if: steps.iai-cache.outputs.cache-hit != 'true'
        run: cargo install iai-callgrind-runner --version 0.16.1

      - name: Resolve baseline ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
            # New branch / first push reports a null SHA; fall back to the first parent.
            case "$sha" in ""|0000000000000000000000000000000000000000)
              sha="$(git rev-parse HEAD~1 2>/dev/null || echo '')" ;;
            esac
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Compare instruction counts vs baseline (macro render_block + per-operator process)
        run: ./.github/scripts/perf-gate.sh "${{ steps.base.outputs.sha }}"

      # Hand the harvested per-case Ir record (layer 1) to the persist job. `always()` so a
      # commit that redded the gate is still recorded — its Ir is valid history. `ignore` when the
      # harness didn't compile against its baseline (no comparison ran): an honest gap, not a failure.
      - name: Upload bench-history record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-history-record
          path: bench-history-record.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # Agent-surface eval gate — the deterministic tier of eval/. Sibling of `bench`: that one
  # watches what the engine costs the CPU, this one watches what the authoring surface costs a model
  # (grounding tokens, repair rounds, freehand-JSON characters). No inference, no network, no model —
  # it replays hand-written reference solutions against the real sidecar, so it is seconds, not
  # minutes, and byte-reproducible. Runs unconditionally on every main/dev push for the same reason
  # `bench` does: a path-skip would punch a hole in the trend on the history branch.
  eval-gate:
    name: agent-surface eval gate
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event.pull_request.draft == false)
      && (needs.changes.outputs.eval == 'true'
          || (github.event_name == 'push'
              && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')))
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the gate swaps the measured surface to the baseline commit

      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Same baseline resolution as the perf gate, so the two trends line up commit for commit.
      - name: Resolve baseline ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.base.sha }}"
          else
            sha="${{ github.event.before }}"
            case "$sha" in ""|0000000000000000000000000000000000000000)
              sha="$(git rev-parse HEAD~1 2>/dev/null || echo '')" ;;
            esac
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # The harness's own forcing function: the structural assertions must still reject the
      # degenerate passes ("change nothing", "delete the broken node"). An assertion that stopped
      # failing would report a green surface while measuring nothing. Stdlib-only — the `tiktoken`
      # differential test lives in the dev extra and skips here, by design.
      - name: Harness unit tests
        run: cd eval && python3 -m unittest discover -s tests -v

      - name: Compare agent-surface cost vs baseline
        run: ./.github/scripts/eval-gate.sh "${{ steps.base.outputs.sha }}"

      - name: Upload eval-history record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-history-record
          path: eval-history-record.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # The trend dashboard's own suite. Stdlib-only, seconds, no build — deliberately NOT folded into
  # `eval-gate`, which builds `reuben-mcp` twice and swaps the measured surface to a baseline commit.
  # What it guards is the consuming half of the reference-rewrite annotation: `reference_revision` is
  # produced by the eval gate and only means anything if the dashboard reads it correctly, and its
  # one job is to tell a re-baseline apart from a regression. A wrong call there tells the reader to
  # discount a real regression, which is worse than saying nothing.
  dashboard:
    name: trend dashboard tests
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.dashboard == 'true'
      && (github.event_name == 'push' || github.event.pull_request.draft == false)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dashboard eval-trend tests
        run: cd .github/scripts && python3 -m unittest test_bench_dashboard -v

  # The hook set's chainer (test_hook_dispatch.py), which is what makes every pre-commit and
  # pre-push check run locally at all. It builds throwaway git repos with synthetic registries, so
  # it needs no toolchain and takes under a second.
  #
  # ALWAYS runs, and not path-filtered: no remaining filter covers `scripts/hooks/**`, and a job
  # this cheap does not earn one of its own. Gates merges via `ci-passed`'s `needs`.
  hook-dispatch:
    name: hook dispatcher (chainer suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hook dispatcher tests
        run: cd scripts && python3 -m unittest test_hook_dispatch -v

  # The doc-claim ledger (extract_doc_claims.py): every file path and code identifier the
  # governed docs name resolves against the real tree, and a `Guarded by:` line names a test that
  # exists. Only that decidable half gates — the counts and single-sourcing claims it also extracts
  # are routed to a reviewer by `--review` and never fail a build, because a gate that guesses at
  # the undecidable half is a gate people learn to ignore.
  #
  # ALWAYS runs, and not path-filtered: a doc claim is falsified by a RENAME. The commit that
  # breaks it touches code and not one line of docs, so any path filter built from doc paths would
  # miss exactly the change that caused the defect.
  doc-claims:
    name: doc claims resolve (claim ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Claim-ledger unit tests
        run: cd scripts && python3 -m unittest test_extract_doc_claims -v
      - name: Doc-claim gate
        run: python3 scripts/extract_doc_claims.py --check .

  # The Sample-alias guard (check_sample_alias.py): the engine's audio element type is named
  # once in crates/reuben-core/src/signal.rs, and a raw f32 slice or vector buffer form may appear
  # only there or in the script's justified allowlist (device layer, resource decode, operator DSP
  # arithmetic, test/bench harnesses). Like `doc-claims`, a stray raw buffer can slip into ANY code
  # change, so this ALWAYS runs (stdlib-only Python; no toolchain setup). Its unit suite runs here
  # too so the guard can't silently rot. Gates merges via `ci-passed`'s `needs`.
  sample-guard:
    name: no raw f32 buffers (sample-alias guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Guard unit test
        run: cd scripts && python3 -m unittest test_check_sample_alias -v
      - name: Sample-alias guard (single naming site for the audio element type)
        run: python3 scripts/check_sample_alias.py .

  # Always-green aggregate merge gate. A ruleset can't require the per-path-filtered jobs above
  # directly: when a job is Skipped (nothing it gates changed) the ruleset reads it as "expected but
  # never reported" and wedges the PR (see the comment at the top of this file). So the `dev` ruleset
  # requires THIS one job instead. It `needs` every merge-gating job and, with `if: always()`, runs
  # even when they skip — failing only if a required upstream reported `failure`/`cancelled`. A
  # Skipped upstream is a pass. Deliberately NOT in `needs`: `bench-history`, which is a post-merge
  # persist rather than a merge gate (`deploy-web` was named here beside it until the web extraction
  # took that job with it) — and `bare-metal`, for a different reason, whose condition has since
  # been met. It was left out while it could not pass, because a gate that reds every PR for a
  # reason no PR caused is one people learn to ignore. It passes now: the port landed, and the
  # render half of the window is cross-built beside `reuben-core` on top of it. So the trigger this
  # paragraph set — list it on the first green run — has fired, and taking that step is the tracked
  # follow-up #749, not a line to slip into an unrelated change: it turns an advisory job into a
  # merge blocker. Until it is taken, a red run there blocks nothing and is easy to miss.
  ci-passed:
    # This `name` is the exact string the `dev` ruleset requires as a status check (GitHub matches
    # required checks by a job's `name`, not its id) — rename it and the ruleset goes on expecting a
    # check that never reports, wedging every PR exactly as a Skipped filtered job would (see the
    # comment at the top of this file). So a rename is never one edit: move the ruleset with it, and
    # grep for `ci-passed` first — the literal string is spelled out in prose elsewhere in the
    # tree, and none of those copies are guarded.
    name: ci-passed
    runs-on: ubuntu-latest
    needs:
      [changes, lockstep, check, windows, bench, eval-gate, dashboard, hook-dispatch,
       sample-guard, doc-claims]
    if: always()
    steps:
      - name: Fail if any required job failed or was cancelled (skipped is OK)
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: $results"
          for r in $results; do
            case "$r" in
              failure|cancelled)
                echo "::error::A required CI job reported '$r'"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."

  # Persist the benchmark trend (layer 1). The ONLY job granted `contents: write`; the gate
  # above stays read-only. Records each commit's absolute Ir to a per-branch orphan branch: main to
  # `bench-history`, dev to `bench-history-dev` (never main/dev themselves — no tree churn, no CI
  # re-trigger). The two trends are fully isolated, so watching dev's trend before promoting to main
  # never touches main's series. `needs: bench` + `always()` so the point is recorded even when the
  # gate failed; never runs for PRs or forks. `bench` now runs unconditionally on every main/dev push
  # (its `if` above), so on these branches the artifact is always present and every push records a
  # point — no path-skip gaps. The download stays `continue-on-error` as a belt-and-suspenders guard:
  # if the harness ever fails to emit an artifact, the append script no-ops rather than redding here.
  # Carries BOTH series: the perf trend and the agent-surface eval trend, side by side on one
  # branch. That is the point of putting them together — a PR that trades engine instructions for
  # grounding tokens is visible in a single view, without `ir` ever holding a token count. Each
  # series appends independently, so a commit where one gate skipped still records the other.
  bench-history:
    name: persist bench history
    runs-on: ubuntu-latest
    needs: [bench, eval-gate]
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download bench-history record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-history-record
          path: _bench_rec
        continue-on-error: true # no artifact (harness didn't run) => append script no-ops
      - name: Download eval-history record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eval-history-record
          path: _eval_rec
        continue-on-error: true
      # Route to the branch's own orphan trend: dev -> bench-history-dev, everything else (main) ->
      # bench-history. The label is the human name the dashboard prints in its copy.
      - name: Append to bench-history branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HIST_BRANCH: ${{ github.ref == 'refs/heads/dev' && 'bench-history-dev' || 'bench-history' }}
          HIST_LABEL: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
        run: |
          ./.github/scripts/bench-history-append.sh \
            _bench_rec/bench-history-record.jsonl "$HIST_BRANCH" "$HIST_LABEL" \
            _eval_rec/eval-history-record.jsonl
