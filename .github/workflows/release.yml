name: Release

# Fires on a `v*` tag push. Builds `--release` binaries and attaches each as a versioned archive
# (tar.gz / zip) + a SHA256 sidecar to the GitHub Release for that tag:
#   - `reuben`, the headless CLI, on Linux + Windows. No installer: the bare
#     binary is the convenience artifact, build-from-source stays the primary path.
#   - `reuben-editor`, the desktop editor, on Linux + Windows + macOS (Apple
#     Silicon, unsigned), with its font licences, the instrument library and the
#     control surfaces.
# Every archive carries a THIRD-PARTY-NOTICES.txt for the crates linked into its binary.
#
# The repository has immutable releases on: once a Release is published, nothing can be uploaded
# to it and its tag can never be used again. So the order is fixed: `draft` creates the Release
# as a draft, every leg uploads into it, and `publish` publishes it only after all of them
# succeeded. A failed leg leaves the draft: re-run the failed jobs and it is reused. Start a release by pushing the tag alone (`git tag vX.Y.Z && git push origin vX.Y.Z`);
# publishing a Release for the tag first, from the web UI or `gh release create` without
# `--draft`, locks it empty, and `draft` refuses it.
#
# `workflow_dispatch` is the dry run: run it on a branch and every leg builds and
# packages, and the archives are uploaded as workflow artifacts only. A dispatch
# on a `v*` tag ref is a release like the tag push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed to create the Release and upload assets.
permissions:
  contents: write

# One release per tag; never let two pushes of the same tag race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Creates the draft every leg uploads into, or reuses one a failed run left. A published Release
  # for the tag is refused here, before any build: it cannot take assets.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create or reuse the draft Release
        shell: bash
        run: |
          # Only "release not found" means there is none; any other failure of `view` is the error.
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>view.err); then
            if [ "$state" != true ]; then
              echo "::error::Release $TAG is already published, so it cannot take assets and" \
                "its tag cannot be reused. Push a new tag instead." >&2
              exit 1
            fi
            echo "Reusing the draft Release for $TAG."
          elif grep -q "release not found" view.err; then
            # A `-` in the tag (v1.1.0-rc1) marks a pre-release.
            prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" $prerelease
          else
            cat view.err >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: draft
    # A dry run skips `draft`; the build still runs.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A named image, not `ubuntu-latest`: the binaries need the glibc they were built
          # against, so the runner's Ubuntu is the oldest one they run on, and the README states it.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            cli: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            cli: true
          # macOS ships the editor only.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            cli: false
    env:
      CARGO_TERM_COLOR: always
      # The oldest macOS the editor runs on, as the README states it; the Rust default for this
      # target today, pinned so a toolchain bump cannot raise it unseen.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      # The job's token can write releases; uploads read it from `GH_TOKEN`, so it stays out of
      # `.git/config` while dependency build scripts run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ALSA dev headers for cpal (Linux only); Windows links WASAPI, macOS CoreAudio. The
      # editor needs nothing more to build: winit, glutin and rfd dlopen their client libraries.
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      # Single source of truth = rust-toolchain.toml.
      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The tag names the archives; a dry run on a branch has none, and a branch name can hold a
      # `/`, so it is named for the commit instead.
      - name: Version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "VERSION=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "EXE=${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Build reuben
        if: matrix.cli
        run: cargo build --release --locked --bin reuben

      # Outside `default-members`, so only `-p` builds it.
      - name: Build reuben-editor
        run: cargo build --release --locked -p reuben-editor

      - name: Install cargo-about
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-about@0.9.3

      # One notices file per binary and target: the editor links the egui/winit/glow tree the CLI
      # does not, and each target links its own audio and windowing crates. Generated from the
      # package that owns the binary; `--fail` stops the release on a crate whose licence cannot be
      # identified or is not accepted in `about.toml`.
      - name: Third-party notices
        shell: bash
        env:
          CLI: ${{ matrix.cli }}
        run: |
          notices() {
            mkdir -p "notices/$1"
            cargo about generate --locked --fail --target "${{ matrix.target }}" \
              -c .github/about/about.toml -m "crates/$2/Cargo.toml" \
              -o "notices/$1/THIRD-PARTY-NOTICES.txt" .github/about/notices.hbs
          }
          if [ "$CLI" = true ]; then notices reuben reuben-native; fi
          notices reuben-editor reuben-editor

      - name: Package reuben
        if: matrix.cli
        shell: bash
        run: >-
          .github/scripts/package-release.sh
          "reuben-$VERSION-${{ matrix.target }}" "${{ matrix.ext }}"
          "target/release/reuben$EXE" LICENSE notices/reuben/THIRD-PARTY-NOTICES.txt README.md

      # Every font the editor embeds ships with its licence, as the OFL and the Ubuntu Font
      # Licence require: the two in the editor's assets, and the ones egui's `default_fonts`
      # feature compiles in, read from the exact epaint_default_fonts version the lockfile builds.
      - name: Gather font licences
        shell: bash
        run: |
          manifest=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "epaint_default_fonts") | .manifest_path')
          if [ "$(printf '%s\n' "$manifest" | grep -c .)" -ne 1 ]; then
            echo "expected one epaint_default_fonts package, found: $manifest" >&2
            exit 1
          fi
          if command -v cygpath >/dev/null; then manifest=$(cygpath -u "$manifest"); fi
          mkdir font-licences
          cp crates/reuben-editor/assets/fonts/*.txt "${manifest%/Cargo.toml}"/fonts/*.txt font-licences/

      # `surfaces/` beside `instruments/` is where the editor looks for an instrument's
      # authored control panel.
      - name: Package reuben-editor
        shell: bash
        run: >-
          .github/scripts/package-release.sh
          "reuben-editor-$VERSION-${{ matrix.target }}" "${{ matrix.ext }}"
          "target/release/reuben-editor$EXE" LICENSE notices/reuben-editor/THIRD-PARTY-NOTICES.txt
          README.md font-licences instruments surfaces

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

      - name: Upload to the draft Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # `--clobber` so a re-run of one failed leg replaces what it uploaded before.
        run: gh release upload "$TAG" dist/* --clobber

  # Publishing is what makes the Release immutable, so it waits for every leg.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the Release
        run: gh release edit "$TAG" --draft=false
