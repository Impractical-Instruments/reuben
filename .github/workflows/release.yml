name: Release

# Fires on a `v*` tag. Both GitHub's Releases GUI and
# `gh release create vX.Y.Z` create the tag and trigger this. Builds `--release`
# binaries and attaches each as a versioned archive (tar.gz / zip) + a SHA256
# sidecar to the GitHub Release:
#   - `reuben`, the headless CLI, on Linux + Windows. No installer: the bare
#     binary is the convenience artifact, build-from-source stays the primary path.
#   - `reuben-editor`, the desktop editor, on Linux + Windows + macOS (Apple
#     Silicon, unsigned), with its font licences, the instrument library and the
#     control surfaces.
#
# `workflow_dispatch` is the dry run: run it on a branch and every leg builds and
# packages, and the archives are uploaded as workflow artifacts only. A dispatch
# on a `v*` tag ref is a release like the tag push.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed to create the Release and upload assets.
permissions:
  contents: write

# One release per tag; never let two pushes of the same tag race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A named image, not `ubuntu-latest`: the binaries need the glibc they were built
          # against, so the runner's Ubuntu is the oldest one they run on, and the README states it.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            cli: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            cli: true
          # macOS ships the editor only.
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            cli: false
    env:
      CARGO_TERM_COLOR: always
      # The oldest macOS the editor runs on, as the README states it; the Rust default for this
      # target today, pinned so a toolchain bump cannot raise it unseen.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ALSA dev headers for cpal (Linux only); Windows links WASAPI, macOS CoreAudio. The
      # editor needs nothing more to build: winit, glutin and rfd dlopen their client libraries.
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

      # Single source of truth = rust-toolchain.toml.
      - name: Setup pinned Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The tag names the archives; a dry run on a branch has none, and a branch name can hold a
      # `/`, so it is named for the commit instead.
      - name: Version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "VERSION=$REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "EXE=${{ runner.os == 'Windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Build reuben
        if: matrix.cli
        run: cargo build --release --locked --bin reuben

      # Outside `default-members`, so only `-p` builds it.
      - name: Build reuben-editor
        run: cargo build --release --locked -p reuben-editor

      - name: Package reuben
        if: matrix.cli
        shell: bash
        run: >-
          .github/scripts/package-release.sh
          "reuben-$VERSION-${{ matrix.target }}" "${{ matrix.ext }}"
          "target/release/reuben$EXE" LICENSE README.md

      # Every font the editor embeds ships with its licence, as the OFL and the Ubuntu Font
      # Licence require: the two in the editor's assets, and the ones egui's `default_fonts`
      # feature compiles in, read from the exact epaint_default_fonts version the lockfile builds.
      - name: Gather font licences
        shell: bash
        run: |
          manifest=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "epaint_default_fonts") | .manifest_path')
          if [ "$(printf '%s\n' "$manifest" | grep -c .)" -ne 1 ]; then
            echo "expected one epaint_default_fonts package, found: $manifest" >&2
            exit 1
          fi
          if command -v cygpath >/dev/null; then manifest=$(cygpath -u "$manifest"); fi
          mkdir font-licences
          cp crates/reuben-editor/assets/fonts/*.txt "${manifest%/Cargo.toml}"/fonts/*.txt font-licences/

      # `surfaces/` beside `instruments/` is where the editor looks for an instrument's
      # authored control panel.
      - name: Package reuben-editor
        shell: bash
        run: >-
          .github/scripts/package-release.sh
          "reuben-editor-$VERSION-${{ matrix.target }}" "${{ matrix.ext }}"
          "target/release/reuben-editor$EXE" LICENSE README.md
          font-licences instruments surfaces

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

      # Each matrix job uploads its own assets; the action gets-or-creates the
      # Release for this tag, so every leg lands on the same Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
