# Raise the x86-64 baseline to the `x86-64-v3` microarchitecture level (AVX2/FMA: Intel Haswell,
# 2013, and AMD Excavator, 2015, on). The default `x86-64` target is SSE2-only, so `f32::floor()`
# (the per-sample phase wrap in oscillator/lfo/clock and every rounding operator) can't use the
# SSE4.1 `roundss` instruction and falls back to a libc `floorf` call. `x86-64-v2` inlines that to
# one instruction (-20% instructions on the oscillator micro-bench, -35% on the LFO). v3 adds FMA,
# which fuses the per-sample multiply-adds: a further -13% on the oscillator and -4% on the LFO
# against v2 (callgrind).
#
# The cost is the hardware floor: every x86-64 binary built here, release archives included, runs
# only on a CPU with AVX2 and FMA, and the README states that floor.
#
# Scoped to x86_64 so it never reaches aarch64/etc. (where `x86-64-v3` is not a valid `target-cpu`,
# and `floor` already inlines to a native rounding instruction).
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# Cargo aliases for this workspace.
[alias]
# Run the full benchmark suite — both the macro (render_block) layer and the per-operator micro
# layer — with the `bench` feature the micro `[[bench]]` targets require. A bare
# `cargo bench` still runs the macro layer; the micro targets declare `required-features = ["bench"]`
# so they're skipped (not errored) without this flag. Use this alias to get everything in one word.
# The benches live in reuben-document: every realistic workload is an instrument document, and the
# loader that turns one into a Plan is that crate's. What they measure is still reuben-core.
reuben-bench = "bench -p reuben-document --features bench"
# Shortcut to play an instrument patch
reuben-play = "run -p reuben-native --bin reuben -- play"
