[workspace]
resolver = "2"
members = [
    "crates/reuben-contract",
    "crates/reuben-macros",
    "crates/reuben-core",
    "crates/reuben-document",
    "crates/reuben-api",
    "crates/reuben-native",
    "crates/reuben-mcp",
    "crates/reuben-guide",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
# MSRV — kept in lockstep with rust-toolchain.toml's `channel`, and constrained beyond that
# lockstep by what operator self-registration needs from the linker, so a rollback is not free.
# see rules: web-product-process
# Self-verified: CI runs on the pinned toolchain, which == this floor.
rust-version = "1.96.0"
license = "BSD-3-Clause"
repository = "https://github.com/Impractical-Instruments/reuben"

[workspace.dependencies]
# `default-features = false` here rather than per-crate: cargo ignores a member's
# `default-features = false` unless the workspace entry states one, so the render half's
# requirement has to be the shared default. slotmap's `std` feature gates exactly one item —
# `SparseSecondaryMap` — which no crate here names, so nothing pays for it.
slotmap = { version = "1", default-features = false }
smallvec = "1"
# The shared sine table's once-cell. It has to be a cell rather than a `const` table: the image
# executes from external QSPI, and a per-sample fetch across that bus is exactly the latency a
# realtime block budget cannot absorb — so the table is built into RAM at boot and read locally.
# `default-features = false` + `alloc` selects the `race` module, whose `OnceBox` is `no_std` and
# lock-free over a single atomic pointer, which the Cortex-M7 has natively. That avoids a
# `critical-section` implementation, which every embedder would then owe.
once_cell = { version = "1", default-features = false, features = ["alloc"] }
# Generic numeric traits (Zero/One/Euclid) so the pointwise math operators are written once over any
# number type, not pinned to f32. The overflow-prone operations bind the workspace's own
# `PointwiseNum` instead: num-traits' saturating traits are integer-only, so they cannot express the
# f32 half of a bound that has to be total at every instantiated type.
num-traits = "0.2"
# Compile-time operator self-registration. see rules: composition-operators
linkme = "0.3"
# Compile-time codegen: the operator_contract! proc-macro parses its own grammar (not Rust
# items/exprs); the ArgValue derive parses a type definition, which needs `derive`.
# Neither needs the heavy `full` expression AST.
syn = { version = "2", default-features = false, features = ["parsing", "printing", "proc-macro", "derive"] }
quote = "1"
proc-macro2 = "1"
hound = "3"
approx = "0.5"
# Instrument format (serde) — portable core authoring layer.
# The shared entry carries only `derive`, because reuben-contract is reached from a bare-metal
# target where no `std` exists to link and a member cannot subtract a default the workspace
# asserts. Every crate that wants the `std` impls names `std` itself.
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
# JSON Schema derive for the window's advertised types: a door emits each tool's `outputSchema`
# from these. Also optional in reuben-document behind its default-off `schemars` feature, which now
# carries only the projection's format-completeness guard.
schemars = "1"
# Native layer (reuben-native) only.
cpal = "0.15"
rosc = "0.10"
clap = { version = "4", features = ["derive"] }
# Lock-free SPSC ring between the input callback and the render thread. Wait-free push/pop,
# no locks, no allocation after creation.
rtrb = "0.3"
# MCP sidecar ONLY (reuben-mcp) — the ~34-package rmcp/tokio tree is fenced out of every other
# workspace member. `default-features = false` here keeps the network stack off;
# reuben-mcp enables exactly `server`, `macros`, `transport-io` (stdio) and no HTTP/reqwest
# transport. reuben-mcp is the first workspace member allowed an async runtime.
rmcp = { version = "2", default-features = false }
# current_thread runtime, sync/rt/time/io-std only — no `net`, so no mio/OS reactor.
tokio = { version = "1", default-features = false }
# Unix SIGINT/SIGTERM handler for `reuben play`'s clean shutdown:
# std has no signal API. Already in the tree transitively (via cpal); not an async dependency,
# so it does not touch the tokio fence. reuben-native takes it only on `cfg(unix)`.
libc = "0.2"

# Benchmark profile: pin a single codegen unit so operator codegen is deterministic.
# see rules: web-product-process
# With the default 16 CGUs, adding cold source to reuben-core repartitions LLVM's codegen units
# and re-rolls register allocation / instruction selection for each operator's vtable-dispatched
# `process` — swinging its callgrind Ir ±13% with ZERO change in actual work (identical Dr/Dw
# traffic, identical fmodf call counts). That fooled the micro_iai Ir gate into false regressions
# on any PR that merely grows the crate. codegen-units = 1 makes per-operator codegen invariant to
# crate size, so the gate measures real work, not CGU-partition luck. Bench profile ONLY — release
# stays at the default so shipped binaries keep parallel codegen (production perf is unaffected).
[profile.bench]
codegen-units = 1
